<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 테트리스</title>
    <style>
        body {
            background-color: #202028;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }
        canvas {
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="score-board">점수: <span id="score">0</span></div>
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <div class="controls-info">
        방향키(⬅️ ➡️ ⬇️): 이동<br>
        위 방향키(⬆️): 회전<br>
        스페이스바(Space): 한 번에 내리기
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        
        // 블록 크기 스케일링 (10칸 x 20칸)
        context.scale(20, 20);

        // 테트리스 블록 모양들
        const createPiece = (type) => {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            if (type === 'O') return [[2, 2], [2, 2]];
            if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        };

        // 블록 색상
        const colors = [
            null,
            '#FF0D72', '#0DC2FF', '#0DFF72',
            '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
        ];

        // 맵 생성
        const createMatrix = (w, h) => {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        };
        const arena = createMatrix(12, 20);

        // 플레이어 객체
        const player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
        };

        // 충돌 체크
        const collide = (arena, player) => {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                        (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        };

        // 블록을 맵에 고정
        const merge = (arena, player) => {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        };

        // 라인 지우기 및 점수 계산
        const arenaSweep = () => {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
        };

        // 렌더링
        const drawMatrix = (matrix, offset) => {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.fillStyle = 'rgba(0,0,0,0.1)'; // 약간의 테두리 효과
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        };

        const draw = () => {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, { x: 0, y: 0 });
            drawMatrix(player.matrix, player.pos);
        };

        // 블록 아래로 이동
        const playerDrop = () => {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        };

        // 하드 드롭 (스페이스바)
        const playerHardDrop = () => {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        };

        // 블록 좌우 이동
        const playerMove = (dir) => {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        };

        // 새 블록 생성 (게임오버 체크 포함)
        const playerReset = () => {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                // 게임 오버 초기화
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        };

        // 블록 회전
        const playerRotate = (dir) => {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            
            // 벽 충돌 시 밀어내기 처리
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir); // 회전 실패 시 원상복구
                    player.pos.x = pos;
                    return;
                }
            }
        };

        // 행렬 회전 알고리즘
        const rotate = (matrix, dir) => {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        };

        // 게임 루프 타이머
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        const update = (time = 0) => {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        };

        // 점수 UI 업데이트
        const updateScore = () => {
            document.getElementById('score').innerText = player.score;
        };

        // 키보드 이벤트 리스너
        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) playerMove(-1); // 왼쪽 화살표
            else if (event.keyCode === 39) playerMove(1);  // 오른쪽 화살표
            else if (event.keyCode === 40) playerDrop();   // 아래 화살표
            else if (event.keyCode === 38) playerRotate(1); // 위 화살표
            else if (event.keyCode === 32) playerHardDrop(); // 스페이스바
        });

        // 초기화 및 게임 시작
        playerReset();
        updateScore();
        update();

    </script>
</body>
</html>
